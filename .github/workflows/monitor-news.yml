name: Monitor news update schedule

on:
  schedule:
    - cron: "0 1,13 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  check-scheduled-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a recent scheduled news update
        uses: actions/github-script@v7
        with:
          script: |
            const workflow_id = "update-news.yml";
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id,
              event: "schedule",
              per_page: 20,
            });
            const cutoff = Date.now() - 4 * 60 * 60 * 1000;
            const recentSuccess = data.workflow_runs.find((run) =>
              run.status === "completed"
              && run.conclusion === "success"
              && Date.parse(run.created_at) >= cutoff
            );
            const marker = "<!-- drgs-news-automation-alert -->";
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const alert = issues.find((issue) => !issue.pull_request && issue.body?.includes(marker));

            if (recentSuccess) {
              core.summary.addHeading("News automation schedule is healthy");
              core.summary.addLink(
                `Latest scheduled completion: ${recentSuccess.updated_at}`,
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${recentSuccess.id}`
              );
              await core.summary.write();
              core.info(`Latest scheduled update completed at ${recentSuccess.updated_at}.`);
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/${workflow_id}`;
            const body = `${marker}\nNo successful scheduled news update was recorded in the four hours before the monitor ran at ${new Date().toISOString()}.\n\nThis may indicate a delayed or missed GitHub Actions schedule. Check the [news updater runs](${runUrl}). The previous successful archive remains available.`;
            if (alert) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: alert.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: "News automation needs attention",
                body,
              });
            }
            core.setFailed("No successful scheduled news update was found in the monitoring window.");
